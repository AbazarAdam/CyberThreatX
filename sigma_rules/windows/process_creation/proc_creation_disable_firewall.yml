title: Disabling Windows Firewall
id: a1b2c3d4-e5f6-7a8b-9c0d-123456789011
status: stable
description: Detects attempts to disable the Windows Firewall
author: CyberThreatX
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\netsh.exe'
    selection_cmd1:
        CommandLine|contains: 'advfirewall'
    selection_cmd2:
        CommandLine|contains: 'firewall'
    selection_cmd3:
        CommandLine|contains: 'set allprofiles state off'
    condition: selection_image and all of selection_cmd*
level: high
tags:
    - attack.defense_evasion
    - attack.t1562.004
